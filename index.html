<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EAF1FA">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Учим Muzzy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@400;600;700;800&family=Pangolin&display=swap">
<style>
/* Layout: one phone-width column. Film-strip frames carry the pictures; the rest stays calm so the phrases are the loudest thing. */
:root{
  --bg:#EAF1FA; --surface:#FFFFFF; --surface-2:#F4F7FC; --ink:#1B2648; --muted:#56638A; --line:#D3DDEC;
  --accent:#2B5FD6; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --sun:#E8A800; --sun-soft:#FFF2C4;
  --good:#138A59; --good-soft:#D8F2E5; --good-ink:#FFFFFF;
  --hint:#FFE07A; --blank:#FFF6D6;
  --film:#191E2C; --hole:#E6ECF6;
  --sp-norman:#FFD9BE; --sp-wife:#F7D0E4; --sp-interviewer:#D3E0FF; --sp-muzzy:#CBEED2; --sp-bob:#CBE6FA;
  --sp-boy:#FFEAA6; --sp-voice:#E1D9FF; --sp-both:#FFD5CD; --sp-caption:#E3E9F3;
  --f-display:'Pangolin','Comic Sans MS','Chalkboard SE',cursive;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-en:'Andika','Nunito',system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10162A; --surface:#19223F; --surface-2:#1F2A4C; --ink:#EDF1FF; --muted:#A3AECF; --line:#2B3762;
    --accent:#7FA3FF; --accent-ink:#0E1430; --accent-soft:#25335F;
    --sun:#FFCB45; --sun-soft:#3B3216;
    --good:#45CF95; --good-soft:#173A2E; --good-ink:#0B1F17;
    --hint:#7A6418; --blank:#2E2A18;
    --film:#070A13; --hole:#C9D3E8;
    --sp-norman:#5A3A26; --sp-wife:#583049; --sp-interviewer:#2C3A6B; --sp-muzzy:#24503A; --sp-bob:#21486A;
    --sp-boy:#5A4A1C; --sp-voice:#3D3470; --sp-both:#5A302B; --sp-caption:#2D3550;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#19223F; --surface-2:#1F2A4C; --ink:#EDF1FF; --muted:#A3AECF; --line:#2B3762;
  --accent:#7FA3FF; --accent-ink:#0E1430; --accent-soft:#25335F;
  --sun:#FFCB45; --sun-soft:#3B3216;
  --good:#45CF95; --good-soft:#173A2E; --good-ink:#0B1F17;
  --hint:#7A6418; --blank:#2E2A18;
  --film:#070A13; --hole:#C9D3E8;
  --sp-norman:#5A3A26; --sp-wife:#583049; --sp-interviewer:#2C3A6B; --sp-muzzy:#24503A; --sp-bob:#21486A;
  --sp-boy:#5A4A1C; --sp-voice:#3D3470; --sp-both:#5A302B; --sp-caption:#2D3550;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 56px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-4px}
.top__back{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;font-size:20px;cursor:pointer;flex:none;box-shadow:0 1px 0 var(--line)}
.top__title{font:700 16px/1.2 var(--f-ui);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top__sound{border:0;background:var(--surface);border-radius:999px;height:40px;padding:0 12px;font:700 13px/1 var(--f-ui);cursor:pointer;flex:none;color:var(--muted)}
.top__sound[aria-pressed="true"]{color:var(--accent)}

/* type */
.eyebrow{margin:0;font:800 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(34px,9vw,44px)}
h2{font-size:24px}
.lead{margin:0;color:var(--muted)}
.en{font-family:var(--f-en)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:0;font:800 16px/1 var(--f-ui);cursor:pointer;text-decoration:none;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn--primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn--good{background:var(--good);color:var(--good-ink);box-shadow:none}
.btn--wide{width:100%}
.btn--small{min-height:40px;padding:0 14px;font-size:14px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.speak{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-size:18px;cursor:pointer;flex:none;display:grid;place-items:center}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:18px}
.starbank{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--sun-soft);border-radius:999px;padding:8px 14px;font:800 15px/1 var(--f-ui)}
.starbank b{color:var(--sun);font-size:18px}
.partcard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:var(--r);padding:18px;border:0;text-align:left;cursor:pointer;width:100%}
.partcard__head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.partcard__title{font:400 30px/1 var(--f-display)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .4s ease}
.note{font-size:14px;color:var(--muted);margin:0}

/* scene list */
.scenes{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.scene{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;background:var(--surface);border:0;border-radius:var(--r);padding:14px;text-align:left;cursor:pointer}
.scene__day{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;text-align:center;font:800 11px/1.1 var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scene__day b{display:block;font:400 24px/1 var(--f-display);color:var(--ink);letter-spacing:0}
.scene.is-done .scene__day{background:var(--good-soft)}
.scene__body{min-width:0;display:flex;flex-direction:column;gap:3px}
.scene__title{font:700 17px/1.2 var(--f-en)}
.scene__ru{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:5px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.tag{font:800 12px/1 var(--f-ui);padding:6px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.tag--done{background:var(--good-soft);color:var(--good)}
.tag--due{background:var(--sun-soft);color:var(--ink)}
.tag--go{background:var(--accent-soft);color:var(--accent)}

/* film frame */
.frame{position:relative;background:var(--film);border-radius:12px;padding:15px 8px}
.frame::before,.frame::after{content:"";position:absolute;left:10px;right:10px;height:6px;background:radial-gradient(circle,var(--hole) 0 2.1px,transparent 2.6px) 0 0/14px 6px repeat-x}
.frame::before{top:4px}.frame::after{bottom:4px}
.frame__pic{aspect-ratio:4/3;max-width:100%;border-radius:6px;background:var(--tint,var(--sp-caption));display:grid;place-items:center;overflow:hidden}
.frame__pic img{width:100%;height:100%;object-fit:cover;display:block}
.frame__art{font-size:64px;line-height:1;letter-spacing:6px;padding-left:6px}
.frame__who{position:absolute;left:14px;bottom:20px;background:var(--film);color:#FFFFFF;font:800 12px/1 var(--f-ui);padding:5px 9px;border-radius:999px}
.frame--lg{width:100%;max-width:330px;margin-inline:auto}
.frame--lg .frame__art{font-size:clamp(56px,18vw,84px)}
.frame--md{padding:12px 6px}
.frame--md::before,.frame--md::after{height:5px;background-size:11px 5px;left:8px;right:8px}
.frame--md::before{top:3px}.frame--md::after{bottom:3px}
.frame--md .frame__art{font-size:38px;letter-spacing:3px}
.frame--md .frame__who{display:none}
.frame--xs{width:58px;flex:none;padding:7px 4px;border-radius:8px}
.frame--xs::before,.frame--xs::after{height:3px;left:5px;right:5px;background:radial-gradient(circle,var(--hole) 0 1.1px,transparent 1.5px) 0 0/7px 3px repeat-x}
.frame--xs::before{top:2px}.frame--xs::after{bottom:2px}
.frame--xs .frame__pic{border-radius:3px}
.frame--xs .frame__art{font-size:20px;letter-spacing:0;padding:0}
.frame--xs .frame__who{display:none}

/* scene page */
.watch{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r);padding:16px}
.exlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.extile{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:16px 14px;cursor:pointer;min-height:132px}
.extile__icon{font-size:30px;line-height:1}
.extile__n{font:800 12px/1 var(--f-ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.extile__t{font:800 17px/1.15 var(--f-ui)}
.extile__d{font-size:13px;color:var(--muted);line-height:1.3}
.extile .tag{position:absolute;top:12px;right:12px}
.extile.is-next{box-shadow:inset 0 0 0 3px var(--accent)}
.extile.is-done{background:var(--good-soft)}
.banner{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border-radius:var(--r);padding:14px 16px}
.banner__star{font-size:34px;line-height:1}
.banner p{margin:0}
details.box{background:var(--surface);border-radius:var(--r);padding:0 16px}
details.box>summary{list-style:none;cursor:pointer;padding:16px 0;font:800 16px/1.2 var(--f-ui);display:flex;justify-content:space-between;gap:10px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"＋";color:var(--muted)}
details.box[open]>summary::after{content:"－"}
.box__in{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.script{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.script li{display:flex;gap:10px;align-items:center}
.script__txt{min-width:0;flex:1;display:flex;flex-direction:column}
.script__who{font:800 12px/1.2 var(--f-ui);color:var(--muted)}
.script__en{font:400 17px/1.3 var(--f-en)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:700 14px/1.2 var(--f-ui)}
.field input{font:600 16px/1 var(--f-ui);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.field small{color:var(--muted);font-size:13px}
.uprow{display:flex;gap:10px;align-items:center}
.uprow .script__txt{font:400 15px/1.25 var(--f-en)}
.upbtn{position:relative;overflow:hidden}
.upbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font:600 13px/1 var(--f-ui);cursor:pointer;padding:6px}

/* exercise */
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1}
.progress span{font:800 14px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.task{margin:0;font:700 17px/1.3 var(--f-ui)}
.msg{min-height:22px;margin:0;font:700 15px/1.3 var(--f-ui);color:var(--muted);text-align:center}
.msg--good{color:var(--good)}
.placed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.placed li{display:flex;align-items:center;gap:10px;background:var(--good-soft);border-radius:14px;padding:6px 10px 6px 6px}
.placed__txt{min-width:0;font:400 16px/1.25 var(--f-en)}
.placed__more{font:700 13px/1 var(--f-ui);color:var(--muted);padding-left:4px}
.placed li.placed__next{background:transparent;border:2px dashed var(--line);justify-content:center;min-height:52px;color:var(--muted);font:800 15px/1 var(--f-ui)}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:0;border-radius:16px;padding:8px 8px 12px;cursor:pointer;text-align:left;min-width:0}
.pcard__who{font:800 11px/1 var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-left:2px}
.pcard__txt{font:400 15px/1.25 var(--f-en);padding:0 2px;overflow-wrap:anywhere}
.is-hint{box-shadow:0 0 0 4px var(--hint)!important;animation:glow 1.2s ease-in-out infinite}
.stagecard{display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:var(--r);padding:16px}
.cue{font:400 15px/1.3 var(--f-en);color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.cue b{font-family:var(--f-ui);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px}
.sentence{font:400 clamp(22px,6.4vw,28px)/1.5 var(--f-en);text-align:center;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.6em;border-bottom:3px dashed var(--muted);color:transparent;line-height:1.2;margin:0 2px}
.blank.is-now{background:var(--blank);border-bottom-color:var(--accent);border-radius:6px 6px 0 0;animation:glow 1.4s ease-in-out infinite}
.fill{color:var(--good);font-weight:700;border-bottom:3px solid var(--good);line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:58px;border-radius:16px;border:0;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font:700 20px/1.1 var(--f-en);cursor:pointer;padding:8px}
.opt.is-off{opacity:.35;cursor:default}
.builder{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-radius:14px;border:2px dashed var(--line)}
.builder.is-full{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.wchip{border:0;border-radius:12px;padding:10px 14px;font:700 20px/1.1 var(--f-en);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line), 0 2px 0 var(--line);cursor:pointer;min-height:48px}
.wchip--in{background:var(--good);color:var(--good-ink);box-shadow:none;cursor:default}
.slot{width:48px;height:40px;border-radius:10px;border:2px dashed var(--accent);animation:glow 1.4s ease-in-out infinite}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.who-big{text-align:center;font:800 14px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.letters{font:700 clamp(26px,8vw,34px)/1.3 var(--f-en);text-align:center;letter-spacing:.12em;word-spacing:.35em;color:var(--accent)}
.mask{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;font:700 clamp(24px,7vw,30px)/1.25 var(--f-en)}
.mw{display:inline-flex;gap:3px;white-space:nowrap;align-items:flex-end}
.lt{display:inline-block;min-width:.6em;text-align:center;border-bottom:3px solid var(--good);color:var(--accent)}
.lt--h{border-bottom-color:var(--muted);color:transparent}
.lt--p{border-bottom:0;min-width:0;color:var(--ink)}
.lt--new{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.hintrow{display:flex;gap:10px}
.hintrow .btn{flex:1}
.player--ex{max-width:420px;margin-inline:auto}
.markbig{flex-direction:column;gap:6px;min-height:84px;padding:12px 20px;border-radius:22px}
.markbig__t{font:400 18px/1.25 var(--f-en);opacity:.92;text-align:center}
.marklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.marklist li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:8px 10px}
.marklist li.is-cur{box-shadow:inset 0 0 0 3px var(--accent)}
.marklist__t{min-width:0;display:flex;flex-direction:column;font-size:15px;line-height:1.25}
.marklist__ctl{display:flex;align-items:center;gap:6px;flex:none}
.marklist--edit li{flex-direction:column;align-items:stretch;gap:6px}
.mhead{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mlab{font:800 12px/1 var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:62px}
.mauto{font:600 12px/1 var(--f-ui);color:var(--muted)}
.marklist__time.is-auto{opacity:.6}
.nud--txt{font-size:14px}
.marklist__time{font:700 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px;text-align:right}
.nud{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);font:800 18px/1 var(--f-ui);cursor:pointer}
.code{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px;resize:vertical}
.btn:disabled{opacity:.45;cursor:default}
.player{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--film)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytlink{font:700 14px/1.2 var(--f-ui);color:var(--accent);text-align:center}
.reveal{display:flex;align-items:center;gap:10px;justify-content:center}
.toggle{align-self:center;border:0;background:var(--surface-2);border-radius:999px;padding:8px 14px;font:700 13px/1 var(--f-ui);color:var(--muted);cursor:pointer}

/* finish */
.finish{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:32px 8px 8px}
.finish__star{font-size:96px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.finish h1{font-size:clamp(40px,11vw,54px)}
.finish p{margin:0;max-width:34ch}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font:700 15px/1.3 var(--f-ui);padding:12px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:fall 1.8s ease-in forwards}

.shake{animation:shake .4s}
.yay{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes glow{50%{filter:brightness(1.08)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.exlist,.pool{grid-template-columns:1fr}}
</style>

</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Content. Add new parts to PARTS. {word} marks a key word for the gap exercise. ---------- */
const PARTS = [
  { id:'p5', title:'Part V', ru:'Часть 5', video:'q5RydaehcOs', subs:[
    { id:'p5-seasons', title:'Seasons', ru:'Когда темнеет', scene:'Scene 3b', lines:[

function shuffleNot(a,cmp){if(a.length<2)return a.slice();for(let k=0;k<8;k++){const s=shuffle(a);if(s.some((x,i)=>cmp(x)!==cmp(a[i])))return s;}return a.slice().reverse();}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function lineTimes(sub){let own=EDIT()&&(S.set.lt||{})[sub.id];if(own&&own.length>sub.L.length)own=null;return own||sub.lt||[];}
function lineEnds(sub){let own=EDIT()&&(S.set.le||{})[sub.id];if(own&&own.length>sub.L.length)own=null;return own||sub.le||[];}

}
function autoClip(sub,i){
  const T=lineTimes(sub),a=T[i];if(a==null)return null;

function hiddenSlots(ln,bare){const out=[];ln.tokens.forEach((t,w)=>{let li=0;[...t].forEach((ch,c)=>{if(/[A-Za-z]/.test(ch)){if(bare||li>0)out.push(w+':'+c);li++;}});});return out;}

function catOf(w){const l=w.toLowerCase();for(const k in CATS){if(CATS[k].some(x=>x.toLowerCase()===l))return k;}return null;}

function makeOpts(sub,li,bj){
  const right=sub.L[li].keys[bj], lr=right.toLowerCase(), cat=catOf(right);
  const pool=[...new Set(sub.L.flatMap(l=>l.keys))];
  let cand=[];
  if(cat){const inSub=pool.filter(w=>catOf(w)===cat);cand=shuffle(inSub).concat(shuffle(CATS[cat]));}

    <div class="field"><label for="t-${p.id}">Где в видео начинается ${p.title}</label><input id="t-${p.id}" data-in="time" data-id="${p.id}" inputmode="numeric" placeholder="0:00" value="${getT(p.id)!=null?fmt(getT(p.id)):''}"><small>Нужно, чтобы «Смотреть всю часть» пропускала заставку. Формат мин:сек, например 0:57.</small></div>

      <ul class="marklist">${p.subs.map(s=>{const n=lineTimes(s).filter(v=>v!=null).length;return `<li><span class="marklist__t"><span class="script__who">День ${s.day} · ${s.scene}</span><span class="en">${esc(s.title)}</span></span>

    ${exportBox(p)}
  </div></div>`:''}`;
}

function nextStart(s){const subs=s.part.subs,i=subs.indexOf(s);for(let k=i+1;k<subs.length;k++){const v=getT(subs[k].id);if(v!=null)return v;}return null;}
function subView(s){

  ${done?`<div class="banner"><span class="banner__star">⭐</span><p>${due?'<b>Пора повторить!</b> Начни со «Скажи сам», это займёт пару минут.':'<b>Сцена выучена!</b> Можно рассказывать учительнице.'}</p></div>`:''}
  <div class="watch">${videoBlock(s.part,t!=null?t:getT(s.part.id),t!=null?nextStart(s):null,'Смотреть отрывок')}

  <div class="exlist">${EXS.map(e=>`<button class="extile ${p.ex[e.id]?'is-done':''} ${!done&&e===next?'is-next':''}" data-act="ex" data-id="${e.id}">

  <details class="box"><summary>Текст сцены</summary><div class="box__in"><ul class="script">${s.L.map(l=>`<li>${frame(s,l,'xs')}<span class="script__txt"><span class="script__who">${esc(l.who)}</span><span class="script__en">${esc(l.text)}</span></span><button class="speak" data-act="speak" data-i="${l.i}" aria-label="Послушать">🔊</button></li>`).join('')}</ul></div></details>
  ${EDIT()?`<details class="box" open><summary>Режим редактора: время и кадры</summary><div class="box__in">
    <div class="field"><label for="t-${s.id}">Начало отрывка в видео</label><input id="t-${s.id}" data-in="time" data-id="${s.id}" inputmode="numeric" placeholder="мин:сек" value="${t!=null?fmt(t):''}"><small>Заполняется само, когда вы размечаете первую фразу. Менять вручную обычно не нужно.</small></div>
    <div class="field"><label>Фразы из мультика вместо робота-голоса</label>

        :'<small>Работает в версии на GitHub Pages: claude.ai не даёт встраивать YouTube.</small>'}</div>
    <p class="note">Можно заменить рисунок кадра на скриншот из мультика. Скриншоты пока хранятся только на этом устройстве: чтобы они были у всех, пришлите их Claude.</p>
    ${s.L.map(l=>{const has=!!getFrame(s.id,l.i);return `<div class="uprow">${frame(s,l,'xs')}<span class="script__txt">${esc(l.text)}</span>
      <span style="display:flex;flex-direction:column;align-items:center"><label class="btn btn--small upbtn">${has?'Заменить':'Кадр'}<input type="file" accept="image/*" data-up="${l.i}" id="up-${s.id}-${l.i}"></label>${has?`<button class="linkbtn" data-act="unframe" data-i="${l.i}">убрать</button>`:''}</span></div>`;}).join('')}
  </div></details>`:''}`;
}

/* ---------- Marking phrases in the video (parent) ---------- */
let M={k:0};
function markShell(s){
  const T=lineTimes(s),first=T.find(v=>v!=null),st=first!=null?Math.max(0,first-3):(getT(s.id)||getT(s.part.id)||0);
  return `${topbar('sub','Разметка · '+s.scene)}
  <p class="lead">Включите видео чуть раньше сцены. Как только герой начинает фразу, нажмите большую кнопку. Ошибиться не страшно: время потом можно сдвинуть.</p>
  ${playerHTML(s.part,Math.floor(st),0)}
  <div id="markui" style="display:flex;flex-direction:column;gap:14px"></div>`;
}
function drawMark(){
  const s=SUBS[V.sub],T=lineTimes(s),k=Math.min(M.k,s.L.length),el=$('#markui');if(!el)return;
  const cur=s.L[k];
  el.innerHTML=`${cur?`<button class="btn btn--primary btn--wide markbig" data-act="mark-hit"><span>Фраза ${k+1} из ${s.L.length} началась</span><span class="en markbig__t">${esc(cur.text)}</span></button>`
      :'<div class="banner"><span class="banner__star">🎬</span><p><b>Все фразы размечены.</b> Нажмите ▶ у любой, чтобы проверить.</p></div>'}
    ${k>0&&T[k-1]!=null?`<button class="btn btn--small btn--wide" data-act="mark-end-now" data-i="${k-1}">⏹ Фраза ${k} закончилась (если дальше пауза или музыка)</button>`:''}
    <div class="btn-row"><button class="btn btn--small" data-act="mark-back" ${k===0?'disabled':''}>← Предыдущая</button><button class="btn btn--small" data-act="mark-skip" ${cur?'':'disabled'}>Пропустить</button></div>
    <p class="note">Конец фразы по умолчанию — начало следующей. Меняйте его, только если на ▶ слышно лишнее.</p>
    <ol class="marklist marklist--edit">${s.L.map(l=>{const has=T[l.i]!=null,E=lineEnds(s)[l.i],c=has?clipOf(s,l.i):null;return `<li class="${l.i===k?'is-cur':''}">
      <div class="mhead"><span class="marklist__t"><span class="script__who">${l.i+1}. ${esc(l.who)}</span><span class="en">${esc(l.text)}</span></span>${has?`<button class="speak" data-act="speak" data-i="${l.i}" aria-label="Проверить">▶</button>`:''}</div>
      ${has?`<div class="mrow"><span class="mlab">Начало</span><button class="nud" data-act="mark-nudge" data-i="${l.i}" data-d="-0.3" aria-label="Начало раньше">−</button><span class="marklist__time">${fmt1(T[l.i])}</span><button class="nud" data-act="mark-nudge" data-i="${l.i}" data-d="0.3" aria-label="Начало позже">+</button></div>
      <div class="mrow"><span class="mlab">Конец</span><button class="nud" data-act="mark-end" data-i="${l.i}" data-d="-0.3" aria-label="Конец раньше">−</button><span class="marklist__time ${E!=null?'':'is-auto'}">${fmt1(c[1])}</span><button class="nud" data-act="mark-end" data-i="${l.i}" data-d="0.3" aria-label="Конец позже">+</button>
        <button class="nud nud--txt" data-act="mark-end-now" data-i="${l.i}" title="Конец = текущий момент видео">⏹</button>${E!=null?`<button class="linkbtn" data-act="mark-end-reset" data-i="${l.i}">авто</button>`:'<span class="mauto">авто</span>'}</div>`
      :'<div class="mrow"><span class="mlab">Не размечена</span></div>'}</li>`;}).join('')}</ol>
    <button class="btn btn--good btn--wide" data-act="sub">Готово</button>
    <div class="box" style="padding:16px">${exportBox(s.part)}</div>`;
}
function fmt1(v){const m=Math.floor(v/60),sec=(v-m*60).toFixed(1);return m+':'+(sec<10?'0':'')+sec;}
function setMark(s,i,v){S.set.lt=S.set.lt||{};const T=(S.set.lt[s.id]=lineTimes(s).slice());T[i]=Math.max(0,Math.round(v*10)/10);
  const f=T.filter(x=>x!=null);S.set.times[s.id]=Math.max(0,Math.floor(Math.min(...f)-1));save();}
function setEnd(s,i,v){S.set.le=S.set.le||{};const E=(S.set.le[s.id]=lineEnds(s).slice());while(E.length<s.L.length)E.push(null);E[i]=v==null?null:Math.max(0,Math.round(v*10)/10);
  if(E.every(x=>x==null))delete S.set.le[s.id];save();}
function exportMarks(part){const o={};o[part.id]={start:getT(part.id),video:vidId(part)};
  part.subs.forEach(s=>{const T=lineTimes(s),st=getT(s.id);if(st!=null||T.some(v=>v!=null)){o[s.id]={start:st,lt:T.map(v=>v==null?null:v)};const E=lineEnds(s);if(E.some(v=>v!=null))o[s.id].le=s.L.map((_,i)=>E[i]==null?null:E[i]);}});return JSON.stringify(o);}
function exportBox(part){return `<div class="field"><label for="markcode">Код разметки для Claude</label><small>Всё, что вы настроили здесь, хранится только на этом устройстве. Скопируйте код и пришлите его Claude: он впишет разметку в приложение, и она заработает на всех телефонах.</small>
  <textarea id="markcode" class="code" readonly rows="4">${esc(exportMarks(part))}</textarea>
  <button class="btn btn--small" data-act="mark-copy">Скопировать код</button></div>`;}

/* ---------- Exercises ---------- */
function exShell(){
  const e=EXS.find(x=>x.id===X.ex);
  const c=hasClips(X.sub)?clipOf(X.sub,lineTimes(X.sub).findIndex(v=>v!=null)):null;
  return `${topbar('sub',e.n+' · '+e.t)}${c?playerHTML(X.sub.part,Math.floor(c[0]),0,'player--ex'):''}<div class="progress"><div class="bar"><i id="pbar" style="width:0%"></i></div><span id="pnum"></span></div><div id="stage" style="display:flex;flex-direction:column;gap:16px"></div>`;
}
function setProg(n,total){const b=$('#pbar'),t=$('#pnum');if(b)b.style.width=Math.round(n/total*100)+'%';if(t)t.textContent=n+' из '+total;}

function startEx(sub,ex){
  X={sub,ex,miss:0,finished:false,busy:false};
  if(ex==='order'){X.pool=shuffleNot(sub.L.map(l=>l.i),i=>sub.L[i].text);X.placed=[];}
  if(ex==='gaps'){X.li=0;X.bj=0;X.opts=null;X.off=[];}
  if(ex==='words'){X.lines=sub.L.filter(l=>l.tokens.length>=2);X.k=0;setupWords();}
  if(ex==='say'){X.queue=sub.L.map(l=>l.i);X.ok=0;X.open=false;}
  go({s:'ex',sub:sub.id,ex});
}
function setupWords(){const ln=X.lines[X.k];X.wpool=shuffleNot(ln.tokens.map((_,i)=>i),i=>ln.tokens[i]);X.got=[];X.miss=0;}

function drawEx(){
  const st=$('#stage');if(!st)return;
  if(X.finished){st.innerHTML=finishView();return;}
  ({order:drawOrder,gaps:drawGaps,words:drawWords,say:drawSay})[X.ex](st);
}

function drawOrder(st){
  const s=X.sub,L=s.L,n=X.placed.length;setProg(n,L.length);
  const nextText=L[n]?L[n].text:null, show=X.placed.slice(-3), hidden=n-show.length;
  st.innerHTML=`<p class="task">Нажимай на кадры по порядку. Что было ${n?'дальше':'сначала'}?</p>
  <ol class="placed">${hidden>0?`<li style="background:transparent;padding:0"><span class="placed__more">…и ещё ${hidden} ${hidden===1?'фраза':'фразы'} уже на месте</span></li>`:''}
  ${show.map(i=>`<li>${frame(s,L[i],'xs')}<span class="placed__txt">${esc(L[i].text)}</span></li>`).join('')}
  <li class="placed__next">${n+1}-я фраза — какая?</li></ol>
  <p class="msg" id="msg"></p>
  <div class="pool">${X.pool.map(i=>`<button class="pcard ${X.miss>=2&&L[i].text===nextText?'is-hint':''}" data-act="pick-order" data-i="${i}">${frame(s,L[i],'md')}<span class="pcard__who">${esc(L[i].who)}</span><span class="pcard__txt">${esc(L[i].text)}</span></button>`).join('')}</div>`;
}
function pickOrder(i,btn){
  const L=X.sub.L,next=L[X.placed.length];
  if(L[i].text===next.text){
    X.placed.push(i);X.pool.splice(X.pool.indexOf(i),1);X.miss=0;chime();sayLine(X.sub,L[i],true);
    if(!X.pool.length)return finish();
    drawOrder($('#stage'));const m=$('#msg');if(m){m.textContent=rnd(PRAISE);m.className='msg msg--good';}
  }else{
    X.miss++;bump(btn,'shake');const m=$('#msg');
    if(X.miss>=2){m.textContent='Подсказка: нужный кадр светится';m.className='msg';
      document.querySelectorAll('.pcard').forEach(b=>{if(L[+b.dataset.i].text===next.text)b.classList.add('is-hint');});}
    else{m.textContent='Почти! Попробуй другой кадр';m.className='msg';}
  }
}

function drawGaps(st){
  const s=X.sub,ln=s.L[X.li];setProg(X.li,s.L.length);
  if(!X.opts&&X.bj<ln.keys.length)X.opts=makeOpts(s,X.li,X.bj);
  let b=0;
  const sent=ln.raw.split(/(\{[^}]+\})/).map(seg=>{
    const m=seg.match(/^\{(.+)\}$/);if(!m)return esc(seg);
    const k=b++;
    if(k<X.bj)return `<span class="fill">${esc(m[1])}</span>`;
    return `<span class="blank ${k===X.bj?'is-now':''}">${esc(m[1])}</span>`;
  }).join('');
  const prev=X.li>0?s.L[X.li-1]:null, lineDone=X.bj>=ln.keys.length;
  st.innerHTML=`<div class="stagecard">
    ${prev?`<div class="cue"><b>${esc(prev.who)}</b>${esc(prev.text)}</div>`:''}
    ${frame(s,ln,'lg')}
    <div class="sentence" id="sent">${sent}</div></div>
  <p class="msg ${lineDone?'msg--good':''}" id="msg">${lineDone?rnd(PRAISE):'Какое слово пропущено?'}</p>
  ${lineDone?'':`<div class="opts">${X.opts.map((w,k)=>`<button class="opt ${X.off.includes(k)?'is-off':''}" data-act="pick-gap" data-k="${k}" ${X.off.includes(k)?'disabled':''}>${esc(w)}</button>`).join('')}</div>`}`;
}
function pickGap(k,btn){
  if(X.busy)return;
  const s=X.sub,ln=s.L[X.li],w=X.opts[k];
  if(w.toLowerCase()===ln.keys[X.bj].toLowerCase()){
    chime();X.bj++;X.opts=null;X.off=[];
    if(X.bj>=ln.keys.length){
      sayLine(s,ln,true);drawGaps($('#stage'));bump($('#sent'),'yay');X.busy=true;
      setTimeout(()=>{X.busy=false;X.li++;X.bj=0;if(X.li>=s.L.length)finish();else drawGaps($('#stage'));},1300);
    }else drawGaps($('#stage'));
  }else{
    X.off.push(k);bump(btn,'shake');btn.classList.add('is-off');btn.disabled=true;
    const m=$('#msg');m.textContent='Почти! Попробуй другое слово';
  }
}

function drawWords(st){
  const s=X.sub,ln=X.lines[X.k];setProg(X.k,X.lines.length);
  const full=X.got.length===ln.tokens.length, nextTok=ln.tokens[X.got.length];
  st.innerHTML=`<div class="stagecard">${frame(s,ln,'lg')}
    <div class="builder ${full?'is-full':''}" id="build">${X.got.map(i=>`<span class="wchip wchip--in">${esc(ln.tokens[i])}</span>`).join('')}${full?'':'<span class="slot" aria-hidden="true"></span>'}</div></div>
  <p class="msg ${full?'msg--good':''}" id="msg">${full?rnd(PRAISE):'Нажимай на слова по порядку'}</p>
  ${full?'':`<div class="chips">${X.wpool.map(i=>`<button class="wchip ${X.miss>=2&&ln.tokens[i]===nextTok?'is-hint':''}" data-act="pick-word" data-i="${i}">${esc(ln.tokens[i])}</button>`).join('')}</div>`}`;
}
function pickWord(i,btn){
  if(X.busy)return;
  const ln=X.lines[X.k],need=ln.tokens[X.got.length];
  if(ln.tokens[i]===need){
    X.got.push(i);X.wpool.splice(X.wpool.indexOf(i),1);X.miss=0;
    if(X.got.length===ln.tokens.length){
      chime();sayLine(X.sub,ln,true);drawWords($('#stage'));bump($('#build'),'yay');X.busy=true;
      setTimeout(()=>{X.busy=false;X.k++;if(X.k>=X.lines.length)finish();else{setupWords();drawWords($('#stage'));}},1400);
    }else drawWords($('#stage'));
  }else{
    X.miss++;bump(btn,'shake');const m=$('#msg');
    if(X.miss>=2){m.textContent='Подсказка: нужное слово светится';document.querySelectorAll('.chips .wchip').forEach(b=>{if(ln.tokens[+b.dataset.i]===need)b.classList.add('is-hint');});}
    else m.textContent='Почти! Какое слово идёт дальше?';
  }
}

function drawSay(st){
  const s=X.sub,cur=s.L[X.queue[0]],prev=cur.i>0?s.L[cur.i-1]:null;setProg(X.ok,s.L.length);
  st.innerHTML=`<div class="stagecard">
    <div class="cue">${prev?`<b>${esc(prev.who)}</b>${esc(prev.text)}`:'<b>Начало сцены</b>Это первая фраза'}</div>
    ${frame(s,cur,'lg')}
    <div class="who-big">${esc(cur.who)} говорит:</div>
    ${X.open?`<div class="reveal"><div class="sentence" id="sent">${esc(cur.text)}</div><button class="speak" data-act="speak" data-i="${cur.i}" aria-label="Послушать ещё раз">🔊</button></div>`
      :`<div class="mask" aria-label="Подсказка по буквам">${maskHTML(cur,X.rev||0,S.set.bare)}</div>`}
  </div>
  ${X.open?`<p class="msg">Ты сказал так же?</p><div class="btn-row"><button class="btn btn--good" data-act="say-ok">Получилось!</button><button class="btn" data-act="say-again">Ещё разок потом</button></div>`
    :`<p class="msg">Скажи фразу вслух. Если нужно, открой ещё букву.</p>
      <div class="hintrow"><button class="btn" data-act="hint-letter" ${(X.rev||0)>=hiddenSlots(cur,S.set.bare).length?'disabled':''}>+ буква</button><button class="btn" data-act="hint-word" ${(X.rev||0)>=hiddenSlots(cur,S.set.bare).length?'disabled':''}>+ слово</button></div>
      <button class="btn btn--primary btn--wide" data-act="say-open">Проверить</button>
      <button class="toggle" data-act="bare">${S.set.bare?'Показывать первые буквы':'Спрятать первые буквы, как у учительницы'}</button>`}`;
}

function finish(){
  const p=P(X.sub.id),was=allDone(X.sub);
  p.ex[X.ex]=true;p.stars=(p.stars||0)+1;p.last=today();save();
  X.finished=true;X.wasAll=was;setProg(1,1);
  $('#pnum').textContent='Готово';chime();confetti();drawEx();
}
function finishView(){
  const s=X.sub,p=P(s.id),all=allDone(s),next=EXS.find(e=>!p.ex[e.id]);
  const e=EXS.find(x=>x.id===X.ex);
  const lines={order:`Все ${s.L.length} кадров на своих местах.`,gaps:'Все пропущенные слова найдены.',words:`Ты собрал ${X.lines?X.lines.length:''} фраз.`,say:'Ты рассказал всю сцену сам!'}[X.ex];
  return `<div class="finish"><div class="finish__star">⭐</div><h1>${rnd(PRAISE)}</h1>
  <p>${lines} +1 звезда. Всего звёзд: <b>${totalStars()}</b>.</p>
  ${all&&!X.wasAll?'<p><b>Вся сцена пройдена!</b> Можно рассказывать её учительнице. Через день-два загляни сюда и повтори «Скажи сам».</p>':''}
  <div class="btn-row" style="width:100%">${next?`<button class="btn btn--primary" data-act="ex" data-id="${next.id}">Дальше: ${next.t}</button>`:`<button class="btn btn--primary" data-act="sub">К сцене</button>`}
  <button class="btn" data-act="ex" data-id="${e.id}">Ещё раз</button></div></div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, sub=V.sub?SUBS[V.sub]:null;
  switch(a){
    case 'home':go({s:'home'});break;
    case 'part':go({s:'part',part:el.dataset.id||(sub&&sub.part.id)});break;
    case 'sub':go({s:'sub',sub:el.dataset.id||V.sub});break;
    case 'ex':startEx(sub,el.dataset.id);break;
    case 'sound':S.set.sound=!S.set.sound;save();el.setAttribute('aria-pressed',S.set.sound);el.textContent=S.set.sound?'🔊 Звук':'🔈 Без звука';break;
    case 'speak':sayLine(sub,sub.L[+el.dataset.i],false);break;
    case 'pick-order':pickOrder(+el.dataset.i,el);break;
    case 'pick-gap':pickGap(+el.dataset.k,el);break;
    case 'pick-word':pickWord(+el.dataset.i,el);break;
    case 'mark-open':{const ms=SUBS[el.dataset.id]||sub;M={k:Math.max(0,lineTimes(ms).findIndex(v=>v==null))};if(lineTimes(ms).every(v=>v!=null))M.k=ms.L.length;go({s:'mark',sub:ms.id});break;}
    case 'mark-hit':{if(!PL||!PL.ready){toast('Сначала включите видео');break;}let t=0;try{t=PL.p.getCurrentTime();}catch(err){}if(!t){toast('Сначала включите видео');break;}
      setMark(sub,M.k,t-0.3);M.k++;drawMark();break;}
    case 'mark-back':M.k=Math.max(0,M.k-1);drawMark();break;
    case 'mark-skip':M.k++;drawMark();break;
    case 'mark-nudge':{const i=+el.dataset.i;setMark(sub,i,lineTimes(sub)[i]+ +el.dataset.d);drawMark();const c=clipOf(sub,i);if(c)playClip(c[0],c[1]);break;}
    case 'mark-end':{const i=+el.dataset.i,c=clipOf(sub,i);if(!c)break;setEnd(sub,i,c[1]+ +el.dataset.d);drawMark();const c2=clipOf(sub,i);playClip(Math.max(c2[0],c2[1]-2),c2[1]);break;}
    case 'mark-end-now':{const i=+el.dataset.i;let t=0;try{t=PL&&PL.ready?PL.p.getCurrentTime():0;}catch(err){}const a=lineTimes(sub)[i];
      if(!t||a==null||t<=a){toast('Поставьте видео на место, где фраза закончилась');break;}setEnd(sub,i,t);drawMark();toast('Конец фразы '+(i+1)+': '+fmt1(t));break;}
    case 'mark-end-reset':setEnd(sub,+el.dataset.i,null);drawMark();break;
    case 'mark-copy':{const ta=$('#markcode');const done=()=>toast('Код скопирован');try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('Выделено, скопируйте вручную');});}catch(err){ta.select();toast('Выделено, скопируйте вручную');}break;}
    case 'hint-letter':X.rev=(X.rev||0)+1;drawEx();break;
    case 'hint-word':{const ln=sub.L[X.queue[0]];X.rev=nextWordExtra(ln,X.rev||0,S.set.bare);drawEx();break;}
    case 'say-open':X.open=true;drawEx();sayLine(sub,sub.L[X.queue[0]],true);break;
    case 'say-ok':X.queue.shift();X.ok++;X.open=false;X.rev=0;chime();if(!X.queue.length)finish();else{drawEx();toast(rnd(PRAISE));}break;
    case 'say-again':X.queue.push(X.queue.shift());X.open=false;X.rev=0;drawEx();toast('Хорошо, вернёмся к ней в конце');break;
    case 'bare':S.set.bare=!S.set.bare;X.rev=0;save();drawEx();break;
    case 'unframe':try{localStorage.removeItem(frameKey(sub.id,+el.dataset.i));}catch(err){}keepOpen();break;
  }
});
function keepOpen(){const open=[...document.querySelectorAll('details.box')].map(d=>d.open);const y=window.scrollY;render();document.querySelectorAll('details.box').forEach((d,i)=>{if(open[i])d.open=true;});window.scrollTo(0,y);}

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.in==='time'){
    const v=parseTime(el.value);
    if(v===null){delete S.set.times[el.dataset.id];save();toast('Время убрано');}
    else if(isNaN(v)){toast('Напишите время как 3:25');return;}
    else{S.set.times[el.dataset.id]=v;save();el.value=fmt(v);toast('Сохранено: '+fmt(v));}
    if(V.s==='sub')keepOpen();
  }
  if(el.dataset.in==='video'){S.set.video[el.dataset.id]=el.value.trim();if(!el.value.trim())delete S.set.video[el.dataset.id];save();toast('Ссылка сохранена');keepOpen();}
  if(el.dataset.up!=null&&el.files&&el.files[0]){
    const sub=SUBS[V.sub],i=+el.dataset.up,f=el.files[0],r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const w=Math.min(480,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{localStorage.setItem(frameKey(sub.id,i),c.toDataURL('image/jpeg',.72));toast('Кадр добавлен');}catch(err){toast('На устройстве не хватило места для кадра');}
      keepOpen();};img.src=r.result;};
    r.readAsDataURL(f);
  }
});

window.addEventListener('hashchange',()=>render());
load();render();
})();
</script>
